import subprocess

import lit.util
from lit.llvm import llvm_config

if llvm_config.use_lld(required=False):
    config.available_features.add("lld")

# These tools are folded with per-invocation globals only when the unified
# feature is active. Detect that configuration from the driver itself so this
# local test stays independent of build-system details not exported to lit.
llvm_driver = lit.util.which("llvm", config.llvm_tools_dir)
if llvm_driver:
    try:
        llvm_driver_help = subprocess.check_output(
            [llvm_driver, "--help"], stderr=subprocess.STDOUT, text=True
        )
        llvm_driver_subcommands = set(llvm_driver_help.splitlines())
        required_per_invocation_tools = (
            "pdbutil",
            "profdata",
            "xray",
            "remarkutil",
            "ctxprof-util",
            "cov",
        )
        if all(
            f"  {tool}" in llvm_driver_subcommands
            for tool in required_per_invocation_tools
        ):
            config.available_features.add("llvm-driver-per-invocation-globals")
    except (OSError, subprocess.CalledProcessError):
        pass

if lit.util.which("llvm-driver-per-invocation-test", config.llvm_tools_dir):
    config.available_features.add("llvm-driver-per-invocation-test")
